<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Acesso | ICC Contabilidade{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#edf2f7;color:#203246;font-size:16px;line-height:1.5}header{background:#142c45;color:#fff;padding:20px max(20px,calc((100% - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header a{color:#fff}main{max-width:1000px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #d7e1ea;border-radius:10px;padding:28px}.narrow{max-width:480px;margin:55px auto}h1{margin:0 0 18px;font-size:25px}h2{font-size:19px}label{display:block;margin:18px 0 6px;font-weight:600}input:not([type=checkbox]){width:100%;font:inherit;padding:11px;border:1px solid #99aabd;border-radius:5px}button,.button{display:inline-block;font:inherit;font-weight:600;background:#285577;color:white;padding:11px 18px;border:0;border-radius:5px;text-decoration:none;cursor:pointer;margin-top:22px}a{color:#245b86}.muted{color:#586e81;font-size:14px}.error{background:#fff0ef;color:#8b2020;padding:12px;border-left:4px solid #ba3d35;margin:14px 0}.notice{background:#e8f4ec;padding:12px;color:#215d35;margin:14px 0}.check{font-weight:400;display:flex;align-items:center;gap:10px}.check input{width:18px;height:18px;accent-color:#285577;flex-shrink:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 25px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 10px;border-bottom:1px solid #d7e1ea}th{font-size:14px;background:#edf3f8}.table-wrap{overflow-x:auto}.actions{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.actions .button{margin:0}fieldset{border:1px solid #ccd8e3;margin-top:24px;padding:12px 18px 20px}legend{padding:0 8px;font-weight:600}:focus-visible{outline:3px solid #4b94ce;outline-offset:3px}@media(max-width:620px){.grid{display:block}.card{padding:20px}.actions{align-items:flex-start;flex-direction:column}header{padding:18px}main{margin:20px auto}}
</style></head><body><header><strong>ICC Contabilidade · Aplicações</strong>{% if usuario %}<a href="/" target="_top">Voltar ao portal</a>{% endif %}</header><main>
{% for message in get_flashed_messages() %}<div class="notice" role="status">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
