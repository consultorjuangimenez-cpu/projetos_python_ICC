{% extends 'conta_base.html' %}{% block content %}<section class="card narrow"><h1>Entrar no portal</h1><p class="muted">Use o login cadastrado pelo administrador.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login" target="_top"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Login</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
<button type="submit" style="width:100%">Entrar</button></form></section>{% endblock %}
