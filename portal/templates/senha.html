{% extends 'conta_base.html' %}{% block content %}<section class="card narrow"><h1>Alterar minha senha</h1>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="current">Senha atual</label><input id="current" name="current" type="password" maxlength="128" required autocomplete="current-password"><label for="password">Nova senha</label><input id="password" name="password" type="password" minlength="4" maxlength="128" required autocomplete="new-password"><label for="confirm">Repita a nova senha</label><input id="confirm" name="password_confirm" type="password" minlength="4" maxlength="128" required autocomplete="new-password"><button type="submit">Alterar senha</button><p class="muted">Após salvar, será necessário entrar novamente em todos os computadores.</p></form></section>{% endblock %}
